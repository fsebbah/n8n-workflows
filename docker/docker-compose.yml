services:
  n8n:
    # Image officielle n8n (redis-cli plus nécessaire depuis RFC-090)
    image: docker.n8n.io/n8nio/n8n:2.29.7
    container_name: n8n
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "5678:5678"
    env_file:
      - .env.local
    environment:
      # Custom nodes path (required for n8n to load them)
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/nodes

    volumes:
      # Données persistantes n8n (fichiers binaires, logs, cache)
      - n8n_data:/home/node/.n8n

      # Custom nodes (depuis la racine du repo)
      # Custom nodes BUILDÉS — chemin par instance via .env.local (CUSTOM_NODES_DIR)
      - ${CUSTOM_NODES_DIR:-../custom-nodes}:/home/node/.n8n/nodes

      # Workflows JSON (lecture seule pour référence)
      - ../workflows:/home/node/workflows:ro

    networks:
      - n8n-network

    # DNS explicites : le forward vers l'hôte est fragile (vécu : upstream IPv6
    # inaccessible depuis le bridge sur llm → EAI_AGAIN sur toute résolution)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      # .local du parc — les DNS publics ne les connaissent pas, on les fixe ici
      - "databases.local:${DATABASES_LOCAL_IP:-192.168.1.185}"
      - "webs.local:${WEBS_LOCAL_IP:-192.168.1.186}"
      - "host2.local:${HOST2_LOCAL_IP:-192.168.1.171}"
      - "host3.local:${HOST3_LOCAL_IP:-192.168.1.33}"
      - "llm2.local:${LLM2_LOCAL_IP:-192.168.1.97}"
      - "llm.local:${LLM_LOCAL_IP:-192.168.1.180}"
      - "pi6.local:${API_LOCAL_IP:-127.0.0.1}"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 300s

networks:
  n8n-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
