services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env.local
    #environment:
      # Ces variables peuvent être overridées par .env
      #- DB_TYPE=${DB_TYPE:-postgresdb}
      #- DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      #- DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT:-5435}
      #- DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      #- DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      #- DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}

      # Encryption key (CRITIQUE pour les credentials)
      #- N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Server
      #- N8N_HOST=${N8N_HOST:-0.0.0.0}
      #- N8N_PORT=${N8N_PORT:-5678}
      #- N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      #- WEBHOOK_URL=${WEBHOOK_URL}

      # Features
      #- N8N_RUNNERS_ENABLED=${N8N_RUNNERS_ENABLED:-true}
      #- N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      #- N8N_WORKFLOW_HISTORY_ENABLED=${N8N_WORKFLOW_HISTORY_ENABLED:-false}
      #- N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      #- N8N_DISABLE_UI=${N8N_DISABLE_UI:-false}
      #- N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-false}
      #- N8N_VERSION_NOTIFICATIONS_ENABLED=${N8N_VERSION_NOTIFICATIONS_ENABLED:-false}
      #- N8N_GIT_NODE_DISABLE_BARE_REPOS=${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}
      #- N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}

      # Timezone
      #- GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Paris}
      #- TZ=${TZ:-Europe/Paris}

      # Executions
      #- EXECUTIONS_MODE=${EXECUTIONS_MODE:-regular}
      #- EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      #- EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
      #- EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:-true}

      # API Keys (pour les workflows)
      #- OPENAI_API_KEY=${OPENAI_API_KEY:-}
      #- ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      #- MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      #- API_URL=${API_URL:-}
      #- TORAH_API_URL=${TORAH_API_URL:-}
      #- DISCORD_TOKEN=${DISCORD_TOKEN:-}

    volumes:
      # Données persistantes n8n (fichiers binaires, logs, cache)
      - n8n_data:/home/node/.n8n

      # Custom nodes (depuis la racine du repo)
      - ../custom-nodes:/home/node/.n8n/nodes

      # Workflows JSON (lecture seule pour référence)
      - ../workflows:/home/node/workflows:ro

    networks:
      - n8n-network

    extra_hosts:
      # Résolution DNS locale (si nécessaire)
      - "databases.local:${DATABASES_LOCAL_IP:-127.0.0.1}"
      - "pi6.local:${API_LOCAL_IP:-127.0.0.1}"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 300s

networks:
  n8n-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
