services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "5678:5678"
    env_file:
      - .env.local
    environment:
      # Custom nodes path (required for n8n to load them)
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/nodes

    volumes:
      # Données persistantes n8n (fichiers binaires, logs, cache)
      - n8n_data:/home/node/.n8n

      # Custom nodes (depuis la racine du repo)
      - ../custom-nodes:/home/node/.n8n/nodes

      # Workflows JSON (lecture seule pour référence)
      - ../workflows:/home/node/workflows:ro

    networks:
      - n8n-network

    extra_hosts:
      # Résolution DNS locale (si nécessaire)
      - "databases.local:${DATABASES_LOCAL_IP:-127.0.0.1}"
      - "pi6.local:${API_LOCAL_IP:-127.0.0.1}"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 300s

networks:
  n8n-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
