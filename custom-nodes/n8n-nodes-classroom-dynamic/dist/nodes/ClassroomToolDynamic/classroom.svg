<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background rounded rectangle (chalkboard) -->
  <rect x="20" y="30" width="160" height="120" rx="12" fill="#0F9D58"/>

  <!-- Inner board area -->
  <rect x="30" y="40" width="140" height="100" rx="8" fill="#2D7D46"/>

  <!-- Teacher figure (larger, centered top) -->
  <circle cx="100" cy="70" r="15" fill="#FFFFFF"/>
  <rect x="85" y="85" width="30" height="25" rx="5" fill="#FFFFFF"/>

  <!-- Student figures (smaller, bottom row) -->
  <!-- Left student -->
  <circle cx="55" cy="115" r="10" fill="#FFF9C4"/>
  <rect x="45" y="125" width="20" height="15" rx="4" fill="#FFF9C4"/>

  <!-- Center-left student -->
  <circle cx="85" cy="115" r="10" fill="#BBDEFB"/>
  <rect x="75" y="125" width="20" height="15" rx="4" fill="#BBDEFB"/>

  <!-- Center-right student -->
  <circle cx="115" cy="115" r="10" fill="#FFCCBC"/>
  <rect x="105" y="125" width="20" height="15" rx="4" fill="#FFCCBC"/>

  <!-- Right student -->
  <circle cx="145" cy="115" r="10" fill="#C8E6C9"/>
  <rect x="135" y="125" width="20" height="15" rx="4" fill="#C8E6C9"/>

  <!-- Base/stand -->
  <rect x="70" y="150" width="60" height="20" rx="4" fill="#5F6368"/>
  <rect x="90" y="170" width="20" height="10" rx="2" fill="#5F6368"/>
</svg>
