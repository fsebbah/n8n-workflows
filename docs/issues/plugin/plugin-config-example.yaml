# =============================================================================
# Plugin Configuration - Exemple pour stockage PostgreSQL
# =============================================================================
# Ce fichier sert de référence pour l'équipe n8n.
# Ces données sont stockées en base et retournées par le webhook plugin-config-get.
#
# Endpoint: POST /webhook/plugin-config-get
# Request:  { "guild_id": "1458159736775119115" }
# Response: Le contenu de ce fichier au format JSON
# =============================================================================

# -----------------------------------------------------------------------------
# IDENTIFICATION
# -----------------------------------------------------------------------------
plugin:
  name: "recipes"
  version: "1.0.0"
  description: "Plugin de recettes de cuisine"

# -----------------------------------------------------------------------------
# ENTITE METIER (Issue #150)
# -----------------------------------------------------------------------------
# Définit le type d'entité géré par ce plugin
entity:
  type: "recipes"              # Type d'entité: recipes, verses, articles, etc.
  collection: "recipes"        # Nom de la collection Qdrant principale

# -----------------------------------------------------------------------------
# REDIS (Issue #151)
# -----------------------------------------------------------------------------
redis:
  prefix: "recipes"            # Préfixe des clés Redis (défaut = entity.type)

# -----------------------------------------------------------------------------
# QDRANT (Issue #152)
# -----------------------------------------------------------------------------
qdrant:
  collection: "recipes"        # Collection principale (peut différer de entity.collection)
  intent_collection: "intent_history"  # Collection pour l'historique des intentions
  min_score: 0.75              # Score minimum pour les résultats de recherche
  max_results: 10              # Nombre maximum de résultats

# -----------------------------------------------------------------------------
# N8N WEBHOOKS (Issue #153)
# -----------------------------------------------------------------------------
n8n:
  webhook_prefix: "recipes"    # Préfixe des webhooks: {prefix}-youtube, {prefix}-generate, etc.

# -----------------------------------------------------------------------------
# RECHERCHE
# -----------------------------------------------------------------------------
search:
  min_score: 0.75              # Score minimum Qdrant
  max_results: 10              # Résultats max par recherche
  auto_fallback_web: true      # Fallback automatique vers recherche web si aucun résultat

# -----------------------------------------------------------------------------
# FONCTIONNALITES
# -----------------------------------------------------------------------------
features:
  mentions: true               # @Bot mentions activées
  session_continue: true       # Session continue (conversation multi-tours)
  memory: true                 # Mémoire conversationnelle
  document_processing: false   # Traitement de documents (PDF, images)
  shopping_cart: false         # Panier d'achat intégré

# -----------------------------------------------------------------------------
# RATE LIMITING
# -----------------------------------------------------------------------------
rate_limit:
  enabled: true
  messages: 5                  # Nombre de messages max
  window_seconds: 60           # Fenêtre de temps
  cooldown_seconds: 30         # Temps d'attente après dépassement

# -----------------------------------------------------------------------------
# BRANDING (RFC-021)
# -----------------------------------------------------------------------------
branding:
  bot:
    name: "Bot Appetit"
    emoji: "👨‍🍳"
    color: "#FF6B35"           # Orange cuisine (hex)
    description: "Assistant culinaire intelligent pour Discord"
    tagline: "Votre assistant culinaire Discord"
    logo_url: "https://cdn.example.com/bot-appetit/logo.png"
    banner_url: "https://cdn.example.com/bot-appetit/banner.png"
    website_url: "https://bot-appetit.com"
    support_url: "https://discord.gg/bot-appetit"
    author: "Bot Appetit Team"

  emojis:
    success: "✅"
    error: "❌"
    warning: "⚠️"
    search: "🔍"
    loading: "⏳"
    recipe: "🍽️"
    ingredient: "🥕"
    timer: "⏱️"
    favorite: "⭐"
    shopping: "🛒"
    credits: "💳"

  footer:
    text: "Bot Appetit - Ton assistant culinaire"

# -----------------------------------------------------------------------------
# PARAMETRES METIER
# -----------------------------------------------------------------------------
settings:
  default_language: "fr"
  default_servings: 4

# -----------------------------------------------------------------------------
# KEYWORDS / MOTS-CLES (Issue #154 - à implémenter)
# -----------------------------------------------------------------------------
keywords:
  # Mots-clés de salutation
  greetings:
    - "salut"
    - "bonjour"
    - "hello"
    - "coucou"
    - "hey"
    - "bonsoir"

  # Mots-clés d'aide
  help:
    - "aide"
    - "help"
    - "comment"
    - "quoi faire"
    - "commandes"

  # Mots-clés de recherche
  search:
    - "recette"
    - "cherche"
    - "trouve"
    - "donne"
    - "propose"

  # Mots-clés hors scope (à refuser poliment)
  out_of_scope:
    - "politique"
    - "actualité"
    - "météo"
    - "sport"

# -----------------------------------------------------------------------------
# PROMPTS (RFC-021 - externalisation des textes)
# -----------------------------------------------------------------------------
prompts:
  # Messages de salutation (sélection aléatoire)
  greetings:
    - "Salut ! Je suis **{bot_name}**, ton assistant culinaire. Tape `/help` pour voir ce que je sais faire !"
    - "Bonjour ! Comment puis-je t'aider en cuisine aujourd'hui ?"
    - "Hello ! Prêt à cuisiner ? `/recette` pour commencer !"

  # Mention vide (@Bot sans texte)
  empty_mention: >
    Tu m'as mentionné mais tu n'as rien dit !
    Pose-moi une question culinaire ou tape `/help` pour voir mes commandes.

  # Message hors scope
  out_of_scope: |
    Je suis **{bot_name}**, spécialisé en cuisine !
    Pose-moi des questions sur les recettes, ingrédients ou techniques culinaires.
    Tape `/help` pour voir mes commandes.

  # Erreurs
  errors:
    generic: "Oups, je n'ai pas pu traiter ta demande. Réessaie plus tard ou tape `/help` !"
    rate_limit: "Doucement {user_name} ! Tu m'as déjà parlé plusieurs fois. Réessaie dans {cooldown}s."
    search_failed: "Erreur lors de la recherche. Réessaie plus tard."
    no_results: "Désolé, je n'ai pas trouvé de résultat pour **{query}**."

  # Recherche web automatique
  web_search:
    searching: "🔍 Pas de recette pour **{query}** en base, je cherche sur le web..."
    found: "✅ **{title}** trouvée sur le web !"
    not_found: "Désolé, je n'ai pas trouvé de recette pour **{query}** sur le web."

# -----------------------------------------------------------------------------
# SCOPE LLM (RFC-021 - définition du périmètre)
# -----------------------------------------------------------------------------
scope:
  # Ce que le bot PEUT faire
  can:
    - "proposer des recettes selon les ingrédients ou envies"
    - "suggérer des alternatives d'ingrédients"
    - "expliquer des techniques culinaires"
    - "aider à planifier des repas de la semaine"
    - "convertir des unités de mesure"
    - "adapter les quantités selon le nombre de personnes"

  # Ce que le bot NE PEUT PAS faire
  cannot:
    - "donner des conseils médicaux ou nutritionnels thérapeutiques"
    - "prescrire des régimes pour maladies spécifiques"
    - "garantir l'absence d'allergènes"
    - "répondre à des questions sans rapport avec la cuisine"

  # Garde-fous (sujets à refuser)
  guardrails:
    - "Conseils médicaux et nutritionnels thérapeutiques"
    - "Régimes pour maladies (diabète, insuffisance rénale, etc.)"
    - "Sujets non liés à la cuisine (politique, actualités, etc.)"
