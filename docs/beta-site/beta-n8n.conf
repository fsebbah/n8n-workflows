# ============================================================================
# Bêta azy.education — exposition de n8n et limitation des abus
# À inclure dans la configuration Nginx du domaine n8n.azy.education.
# ============================================================================

# Une zone de 10 Mo retient environ 160 000 adresses. Deux inscriptions par minute
# et par adresse IP suffisent largement à un humain, et coupent l'envoi en masse.
limit_req_zone $binary_remote_addr zone=beta_inscription:10m rate=2r/m;

server {
    listen 443 ssl http2;
    server_name n8n.azy.education;

    # ssl_certificate … (certbot ou votre fournisseur)

    # ⚠️ SEUL /webhook/ est exposé. L'interface d'administration de n8n ne doit
    # JAMAIS être joignable depuis Internet : elle donne accès aux identifiants
    # PostgreSQL et SMTP enregistrés dans l'instance.
    location /webhook/beta-inscription {
        limit_req zone=beta_inscription burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host              $host;
        # Sans cet en-tête, toutes les inscriptions porteraient l'IP du proxy :
        # la preuve de consentement perdrait sa valeur.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/beta-confirmation {
        # Pas de limitation ici : un lien cliqué plusieurs fois (client de messagerie
        # qui précharge les URL, par exemple) ne doit pas être bloqué.
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tout le reste — y compris /rest, /workflow et l'interface — est refusé.
    location / {
        return 404;
    }
}
